name: Android build and tests

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit or branch to test (empty = this branch)"
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK packages
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --list 2>/dev/null | grep -o "platforms;android-[0-9A-Za-z.-]*" | sort -u | tail -8 || true
          "$SDKM" --install "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, debug APK, test APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleAndroidTest assemblePhone
      - name: Publish test APK as a direct download (pre-release "loco-test")
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/phone/app-phone.apk LOCO-TEST.apk && ls -l LOCO-TEST.apk
          NOTES="Testowa wersja LOCO TEST (podpis debug). Instaluje się obok zwykłej LOCO, nie zastępuje jej. Commit ${GITHUB_SHA::7}. Bez testu prawdziwej rozmowy z Gemini."
          if gh release view loco-test >/dev/null 2>&1; then
            gh release upload loco-test LOCO-TEST.apk --clobber
            gh release edit loco-test --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          else
            gh release create loco-test LOCO-TEST.apk --prerelease --target "$GITHUB_SHA" --title "LOCO TEST" --notes "$NOTES"
          fi
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loco-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  instrumented:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install SDK packages
        run: |
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" --list 2>/dev/null | grep -o "platforms;android-[0-9A-Za-z.-]*" | sort -u | tail -8 || true
          "$SDKM" --install "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c || true
            ./gradlew --no-daemon connectedDebugAndroidTest || touch /tmp/instrumented-failed
            adb logcat -d -s LocoDiag:E | head -150 || true
            adb logcat -d -b crash | tail -60 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk >/dev/null 2>&1 || true
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk >/dev/null 2>&1 || true
            sh -c 'adb shell am instrument -w -e class com.locospanish.ai.StartupTest com.locospanish.ai.test.test/androidx.test.runner.AndroidJUnitRunner > /tmp/startup.txt 2>&1 &'
            sleep 18
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 && adb shell cat /sdcard/ui.xml | tr '>' '\n' | grep -o 'text="[^"]*"\|scrollable="true"\|clickable="true"' | grep -v 'text=""' | head -80 || true
            adb logcat -d -b crash | tail -60 || true
            sleep 20
            cat /tmp/startup.txt || true
            test ! -f /tmp/instrumented-failed
      - name: Print failed instrumented tests
        if: always()
        shell: python3 {0}
        run: |
          import glob, xml.etree.ElementTree as ET
          total = failed = 0
          for path in glob.glob("app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).iter("testcase"):
                  total += 1
                  for fail in list(case.findall("failure")) + list(case.findall("error")):
                      failed += 1
                      print("FAILED:", case.get("classname"), case.get("name"))
                      print("\n".join((fail.text or "").splitlines()[:10]))
          print(f"Instrumented tests: {total}, failed: {failed}")
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
